[workspace]
members = ["crates/solstone-core", "crates/solstone-core-cli", "crates/solstone-core-journal"]
resolver = "3"

[workspace.package]
version = "0.8.9"
edition = "2024"
rust-version = "1.87"
license = "AGPL-3.0-only"

[workspace.dependencies]
solstone-core-cli = { path = "crates/solstone-core-cli" }
solstone-core-journal = { path = "crates/solstone-core-journal" }
serde_json = "1.0.150"
toml_edit = { version = "0.22.27", default-features = false, features = ["parse"] }
