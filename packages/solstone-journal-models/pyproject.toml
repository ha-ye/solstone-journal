[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solstone-journal-models"
version = "1.0.0"
description = "Bundled solstone journal speaker and VAD model weights"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-only"}

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["solstone_journal_models*"]

[tool.setuptools.package-data]
solstone_journal_models = ["assets/*.onnx", "*.md"]
