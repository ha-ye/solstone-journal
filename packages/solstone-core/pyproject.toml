[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "solstone-core"
version = "1.0.12"
description = "solstone helper binary. Linux wheels are tagged manylinux2014 / glibc 2.17+, while the binary is fully static and has no libc runtime dependency; Alpine installs fall back to the sdist and cargo."
requires-python = ">=3.12"
license = {text = "AGPL-3.0-only"}

[tool.maturin]
bindings = "bin"
manifest-path = "../../core/crates/solstone-core/Cargo.toml"
profile = "release"
strip = true
