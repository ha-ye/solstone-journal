[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solstone"
version = "0.6.20"
description = "Navigate Life Intelligently"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-only"}
authors = [
    {name = "Jer Miller", email = "jer@solpbc.org"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["audio", "transcription", "screenshot", "multimodal", "ai", "gemini"]

dependencies = [
    # The thin `sol` access surface only. `pip install solstone` (the default)
    # is a thin client that talks to a journal — it carries NO provider SDKs,
    # no AI/media/ML runtime, no Flask. Running a journal host here is the
    # deliberate `pip install 'solstone[journal]'` opt-in (the full stack below).
    #
    # This partition is the boundary the access-surface import-clean guard
    # (scripts/check_access_imports_clean.py) and the extras-consistency lint
    # (scripts/check_extras_consistency.py) enforce. Adding a dependency here
    # must keep the `sol` access commands import-clean — do not add anything the
    # journal host needs; that belongs in [journal-host] below.
    "setproctitle",
    "typer",
    "requests",
    # Natural language time parsing (used by `sol` access paths).
    "timefhuman",
    # Link tunnel client (`sol link serve`/`join`, think/link/): TLS 1.3 in
    # memory-BIO mode over an opaque WebSocket; pyOpenSSL supplies the
    # handshake-time verify callback that stdlib ssl can't express.
    "cryptography>=42",
    "pyOpenSSL>=24.0",
    # argon2id for the journal-mark work factor (think/link/mark.py).
    "argon2-cffi",
    "websockets>=13.0",
    "psutil",
    "userpath>=1.9.2,<2",
]

[project.optional-dependencies]
# ---------------------------------------------------------------------------
# The journal-host menu. `pip install solstone` is the thin client (above);
# running a journal here is a deliberate opt-in:
#
#   pip install 'solstone[journal]'        # run a journal — full CPU stack
#   pip install 'solstone[journal-cuda]'   # journal with GPU transcription
#
# [journal] and [journal-cuda] are the same stack; they differ ONLY in the
# ONNX runtime package (CPU vs CUDA). They share [journal-host] (the heavy core
# minus the runtime). Install ONE of them, never both — onnxruntime
# and onnxruntime-gpu own the same `onnxruntime/` import dir and clobber each
# other (see the Makefile note on --all-extras).
#
# [journal] and [journal-cuda] also pull in the solstone-journal-host shim
# distribution, built as the uv workspace member under
# packages/solstone-journal-host/. That shim owns the host-only `journal` and
# `mlx-vlm-server` console scripts; base solstone keeps only `sol`/`solstone`.
#
# [pdf] and [whisper] remain as internal building blocks: they back the
# per-feature install hints (think/features.py) and lazy-import boundaries, and
# [journal-host]/[journal] compose them. They are NOT part of the advertised
# menu — INSTALL.md documents only `solstone` and `solstone[journal]`.
# ---------------------------------------------------------------------------
pdf = [
    "weasyprint>=60.0",
    "pypdf>=4.0.0",
    "pdf2image>=1.16.0",
]

whisper = [
    "faster-whisper>=1.0.0",
]

# The full journal-host stack EXCEPT the ONNX runtime package (which is the
# CPU-vs-CUDA choice deferred to [journal]/[journal-cuda] below). Not a
# user-facing extra — always pulled in via [journal] or [journal-cuda].
journal-host = [
    "python-dotenv",
    "google-genai>=1.62.0",
    "Flask[async]",
    "Markdown",
    "mistune",
    "python-frontmatter",
    "packaging",
    "Pillow>=11.0.0",
    "numpy",
    "av",
    "openai>=1.2.0",
    "openhands-sdk==1.27.*",
    # Pinned to >=1.27.1: that release reverts the Gemini prompt-cache markers
    # (upstream PR #3586 / issue #3585). Emitting cache_control on Gemini froze
    # its cache at the static prefix and disabled Google's implicit caching
    # (~6-14x cost); our default gemini-flash-latest never matched the allowlist,
    # but the bump removes the latent trap for any explicit gemini-2.5/3 pin.
    # openhands-sdk pulls lmnr's OpenTelemetry beta stack. Pin the matching line
    # so pip does not mix newer 1.42/0.63 packages with lmnr's 0.60b1
    # semantic-conventions pin.
    "opentelemetry-api==1.39.1",
    "opentelemetry-sdk==1.39.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.39.1",
    "opentelemetry-exporter-otlp-proto-http==1.39.1",
    "opentelemetry-instrumentation==0.60b1",
    "opentelemetry-instrumentation-threading==0.60b1",
    "opentelemetry-semantic-conventions==0.60b1",
    "anthropic",
    # 0.6.2 = validated continuous-batching-fix baseline; <0.7 pins it
    # so on-device builds don't float past the soak-validated server-wedge fix.
    "mlx-vlm>=0.6.2,<0.7; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx>=0.31.2,<1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "huggingface-hub>=0.24",
    "httpx",
    "h2",
    "jsonschema>=4.26,<5",
    "genai-prices",
    "icalendar",
    "blessed>=1.20.0",
    "tzlocal",
    "python-slugify",
    "rapidfuzz",
    # Audio processing
    "soundfile",
    "kaldi-native-fbank>=1.22",
    # solstone/apps/speakers/{owner,discovery}.py use sklearn.cluster.HDBSCAN.
    # Previously pulled transitively via resemblyzer; now a direct dep.
    "scikit-learn>=1.3",
    # Media processing
    "opencv-python-headless",
    # PDF + faster-whisper fold into the journal host ("choose journal, get it
    # all"). Referenced via the building-block extras so the per-feature hints
    # stay in sync.
    "solstone[pdf]",
    "solstone[whisper]",
]

# Run a journal here — the full host stack with CPU ONNX runtime.
journal = [
    "solstone-journal-host==0.6.20",
    # CPU ONNX runtime: covers VAD, diarization, and the WeSpeaker embedder;
    # !=1.24.1 across the board (known-bad wheel).
    "onnxruntime>=1.20.0,!=1.24.1",
    # Linux/x86_64 keeps the higher floor for current VAD/diarization/WeSpeaker
    # wheel behavior; scripts/check_extras_consistency.py pins this floor.
    "onnxruntime>=1.25.0,!=1.24.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# Run a journal here with GPU ONNX runtime (NVIDIA / Linux x86_64).
# Same stack as [journal] but onnxruntime-gpu in place of the CPU runtime — the
# GPU wheel supplies the `onnxruntime` namespace (incl. CPU providers) for
# VAD, diarization, and WeSpeaker. Install this instead of [journal], not
# alongside it.
journal-cuda = [
    "solstone-journal-host==0.6.20",
    "onnxruntime-gpu>=1.25.0",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-cublas-cu12",
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-nvjitlink-cu12",
]

[project.scripts]
# The base distribution ships only the thin `sol` access CLI. Host-only
# console scripts (`journal`, `mlx-vlm-server`) live in the
# `solstone-journal-host` distribution, pulled in by [journal]/[journal-cuda].
sol = "solstone.think.sol_cli:main"
# `solstone` is an alias for the `sol` access CLI so `uvx solstone` /
# `uv tool run solstone` resolve to the thin client instead of erroring on a
# missing console script. The thin base's small footprint makes the ephemeral
# `uvx solstone ...` one-shot fast (CI, Docker, a second machine, agents).
solstone = "solstone.think.sol_cli:main"

[project.urls]
Homepage = "https://github.com/solpbc/solstone-journal"
Repository = "https://github.com/solpbc/solstone-journal"
Documentation = "https://github.com/solpbc/solstone-journal/blob/main/README.md"
"Bug Tracker" = "https://github.com/solpbc/solstone-journal/issues"

[tool.setuptools]
# Package data is included wholesale via MANIFEST.in (`graft solstone`) plus the
# include-package-data flag below. We deliberately do NOT hand-maintain per-subdir
# package-data globs: that curated list repeatedly dropped data files added in new
# subdirectories — the installed wheel would silently omit e.g.
# solstone/think/contract/layout.json while source-tree `make ci` stayed green,
# hard-500ing observer ingest. Including every non-.py file under solstone/ is the
# correct default here: the wheel is model-dominated (~34 MB of bundled .onnx), so
# the long tail of .json/.md/.html/.schema.json data files is rounding error. If a
# file lives under solstone/ at build time, it ships. New data file → no pyproject
# edit required.
include-package-data = true

[tool.setuptools.packages.find]
include = ["solstone*"]

[tool.uv.workspace]
members = ["packages/solstone-journal-host"]

[tool.uv.sources]
solstone-journal-host = {workspace = true}

# Development tools configuration
[tool.ruff]
target-version = "py312"
exclude = [".venv", "scratch", "logs", "build", "dist"]

[tool.ruff.lint]
select = ["F", "E", "W", "I"]
ignore = ["E501", "E203", "E402"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
exclude = ["tests", ".venv", "scratch", "logs", "build", "dist"]
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "strict"
testpaths = ["tests", "solstone/apps"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "xdist_group: marks tests to run in the same xdist worker group",
]
timeout = 15
tmp_path_retention_policy = "none"
filterwarnings = [
    # Third-party deprecation warnings (Python 3.14+)
    "ignore:codecs.open.* is deprecated:DeprecationWarning",
    "ignore:.*_UnionGenericAlias.* is deprecated:DeprecationWarning",
    "ignore:.*DefaultEventLoopPolicy.* is deprecated:DeprecationWarning",
]

[dependency-groups]
dev = [
    "freezegun",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "ruff",
]
