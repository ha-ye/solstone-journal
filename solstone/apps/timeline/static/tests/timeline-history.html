<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>timeline history smoke</title>
<style>
  body { font: 14px/1.4 sans-serif; padding: 16px; }
  .pass { color: var(--success-ink); }
  .fail { color: var(--danger); }
  #timeline-root { max-width: 760px; }
</style>
<link rel="stylesheet" href="../../../../convey/static/tokens.css">
<link rel="stylesheet" href="../../../../convey/static/day-grid.css">
<link rel="stylesheet" href="../timeline.css">
<h1>timeline history smoke</h1>
<div id="results"></div>
<main id="timeline-root" class="timeline-shell"></main>
<script src="../../../../convey/static/date_format.js"></script>
<script src="../../../../convey/static/date-nav.js"></script>
<script src="../../../../convey/static/day-grid.js"></script>
<script src="../../../../convey/static/relative-time.js"></script>
<script>
  const unit = { one: 'segment', other: 'segments', none: 'no segments' };
  let gridPayload = {
    coverage: { start: '20260101', end: '20260101' },
    days: { 20260101: 1 },
    pending: {}
  };

  window.timelineInitial = { view: 'year', day: null, month: null };
  window.whenShellReady = (callback) => Promise.resolve(callback({
    apps: [{ name: 'timeline', date_nav: { unit } }]
  }));

  function overviewPayload() {
    return {
      now: '2026-01-02T00:00:00',
      today: '20260102',
      generated_at: 1770000000,
      model: 'test-model',
      data_through: '20260101',
      months: [{
        ym: '202601',
        year: 2026,
        month_num: 1,
        days_in_month: 31,
        first_weekday: 3,
        day_count: 1,
        days_with_data: ['20260101']
      }]
    };
  }

  function jsonResponse(body, status = 200) {
    return new Response(JSON.stringify(body), {
      status,
      headers: { 'Content-Type': 'application/json' }
    });
  }

  window.fetch = async (url) => {
    const path = String(url);
    if (path.includes('/app/timeline/api/overview')) return jsonResponse(overviewPayload());
    if (path.includes('/app/timeline/api/grid')) return jsonResponse(gridPayload);
    return jsonResponse({}, 404);
  };
</script>
<script src="../timeline_provenance.js"></script>
<script src="../timeline.js"></script>
<script>
  const results = document.getElementById('results');
  const timelineRoot = document.getElementById('timeline-root');
  let failures = 0;

  function assert(name, condition, detail) {
    const row = document.createElement('div');
    row.className = condition ? 'pass' : 'fail';
    row.textContent = `${condition ? 'PASS' : 'FAIL'} ${name}${detail ? ` - ${detail}` : ''}`;
    results.appendChild(row);
    if (!condition) failures += 1;
  }

  function equal(name, actual, expected) {
    assert(name, actual === expected, `expected "${expected}", got "${actual}"`);
  }

  function frame() {
    return new Promise((resolve) => requestAnimationFrame(() => resolve()));
  }

  async function waitFor(predicate, label) {
    for (let index = 0; index < 60; index += 1) {
      if (predicate()) return;
      await frame();
    }
    throw new Error(`timed out waiting for ${label}`);
  }

  async function renderWith(payload) {
    gridPayload = payload;
    await window.timelineRefresh.index();
  }

  async function run() {
    await waitFor(() => timelineRoot.querySelector('.daygrid'), 'initial timeline grid');
    assert('one-day payload renders grid', Boolean(timelineRoot.querySelector('.daygrid')));
    assert('one-day payload renders summary', Boolean(timelineRoot.querySelector('.timeline-history-lede')));
    equal('one-day payload not empty', Boolean(timelineRoot.querySelector('[data-timeline-state="empty"]')), false);

    await renderWith({ coverage: null, days: {}, pending: {} });
    assert('empty payload renders empty state', Boolean(timelineRoot.querySelector('[data-timeline-state="empty"]')));
    equal('empty payload has no grid', Boolean(timelineRoot.querySelector('.daygrid')), false);

    await renderWith({
      coverage: { start: 'nope', end: 'nope' },
      days: { 20260101: 1 },
      pending: {}
    });
    assert('nonempty invalid payload renders error state', Boolean(timelineRoot.querySelector('[data-timeline-state="error"]')));
    equal('mount-null error has no lede', Boolean(timelineRoot.querySelector('.timeline-history-lede')), false);
    equal('mount-null error has no grid', Boolean(timelineRoot.querySelector('.daygrid')), false);

    if (failures > 0) {
      throw new Error(`${failures} timeline history smoke assertion(s) failed`);
    }
  }

  run().catch((error) => {
    const row = document.createElement('div');
    row.className = 'fail';
    row.textContent = `FAIL unhandled error - ${error.message}`;
    results.appendChild(row);
    throw error;
  });
</script>
</html>
