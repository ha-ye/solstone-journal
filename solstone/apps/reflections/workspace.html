<style>
.reflection-shell {
  max-width: 900px;
  margin: 0 auto;
  padding: 2rem 2rem 5rem;
  color: #1f2937;
}

.reflection-header {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  align-items: flex-start;
  margin-bottom: 1.5rem;
}

.reflection-kicker {
  margin: 0 0 0.35rem;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #92400e;
}

.reflection-title {
  margin: 0;
  font-size: clamp(1.8rem, 4vw, 2.7rem);
  line-height: 1.1;
  color: #111827;
}

.reflection-subtitle {
  margin: 0.35rem 0 0;
  font-size: 1rem;
  color: #6b7280;
}

.reflection-actions {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
}

.reflection-button,
.reflection-link-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  padding: 0 1rem;
  border-radius: 999px;
  border: 1px solid #d6d3d1;
  background: #fffdf8;
  color: #1f2937;
  font: inherit;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}

.reflection-button:hover,
.reflection-link-button:hover {
  background: #fef3c7;
  border-color: #f59e0b;
}

.reflection-body,
.reflection-index {
  background: #fff;
  border: 1px solid #e7e5e4;
  border-radius: 18px;
  padding: 1.5rem;
  box-shadow: 0 20px 40px rgba(15, 23, 42, 0.04);
}

.reflection-grid-card {
  margin-bottom: 1.5rem;
  padding: 1rem 0;
}

.reflection-grid-card[hidden] {
  display: none;
}

.reflection-grid-title {
  margin: 0;
  font-size: 1rem;
  line-height: 1.2;
}

.reflection-grid-lede {
  margin: 0.25rem 0 1rem;
  color: var(--ink-soft-paper);
  font-size: var(--text-sm);
}

.reflection-grid-host {
  min-width: 0;
}

.reflection-grid-legend {
  margin-top: var(--space-2);
}

.reflection-body h1,
.reflection-body h2,
.reflection-body h3 {
  color: #111827;
}

.reflection-body p,
.reflection-body li,
.reflection-index p,
.reflection-index li {
  line-height: 1.7;
}

.reflection-body blockquote {
  margin: 1.5rem 0;
  padding-left: 1rem;
  border-left: 3px solid #f59e0b;
  color: #6b7280;
}

.reflection-body code {
  overflow-wrap: anywhere;
}

.reflection-body a,
.reflection-index a {
  color: #b45309;
}

.reflection-body a:hover,
.reflection-index a:hover {
  color: #92400e;
}

.reflection-index-list {
  list-style: none;
  margin: 1.25rem 0 0;
  padding: 0;
  display: grid;
  gap: 0.75rem;
}

.reflection-index-link {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  align-items: center;
  padding: 1rem 1.1rem;
  border-radius: 14px;
  background: #fffbeb;
  border: 1px solid #fcd34d;
  text-decoration: none;
  color: #1f2937;
}

.reflection-index-link:hover {
  background: #fef3c7;
}

.reflection-index-day {
  font-weight: 600;
}

.reflection-index-token {
  color: #78716c;
  font-size: 0.9rem;
}

.reflection-sample-banner {
  display: block;
  padding: 0.5rem 0.875rem;
  margin: 0 0 1rem;
  border-radius: 0.5rem;
  background: #fffbeb;
  border: 1px solid #fcd34d;
  color: #78716c;
  font-size: 0.9rem;
  font-style: italic;
}

@media (max-width: 720px) {
  .reflection-shell {
    padding: 1.25rem 1rem 4rem;
  }

  .reflection-header {
    flex-direction: column;
  }

  .reflection-actions {
    width: 100%;
  }
}
</style>

<div class="reflection-shell" id="reflectionApp">
  <div data-date-nav></div>
  <h2 class="reflection-title" data-date-nav-heading></h2>
  <div id="reflectionContent"></div>
</div>

<script>
(() => {
  const content = document.getElementById('reflectionContent');

  function escapeHtml(value) {
    const holder = document.createElement('div');
    holder.textContent = value == null ? '' : String(value);
    return holder.innerHTML;
  }

  function decodePart(value) {
    try {
      return decodeURIComponent(value || '');
    } catch (_error) {
      return value || '';
    }
  }

  function viewContext() {
    const parts = window.location.pathname.split('/');
    if (!parts[3]) {
      return {mode: 'index', url: '/app/reflections/api/state'};
    }
    const first = decodePart(parts[3]);
    if (first === 'sample') {
      return {mode: 'sample', url: '/app/reflections/api/sample'};
    }
    return {
      mode: 'detail',
      day: first,
      url: `/app/reflections/api/${encodeURIComponent(first)}`
    };
  }

  function renderLoading() {
    content.innerHTML = window.SurfaceState
      ? window.SurfaceState.loading({text: 'loading reflections...'})
      : '<p>loading reflections...</p>';
  }

  function renderError(err, retry) {
    window.logError?.(err, {context: 'reflections-state'});
    content.innerHTML = window.SurfaceState
      ? window.SurfaceState.error({
          retry: true,
          serverMessage: err?.serverMessage || err?.message || '',
          detail: err
        })
      : '<p>could not load reflections.</p><button type="button" class="surface-state-retry">try again</button>';
    content.querySelector('.surface-state-retry')?.addEventListener('click', retry, {once: true});
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }

    const area = document.createElement('textarea');
    area.value = text;
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    document.execCommand('copy');
    document.body.removeChild(area);
    return Promise.resolve();
  }

  function attachCopyButton(rawUrl) {
    const copyButton = document.getElementById('copyReflectionButton');
    if (!copyButton) return;
    copyButton.addEventListener('click', async () => {
      const originalLabel = copyButton.textContent;
      try {
        const response = await fetch(rawUrl, {credentials: 'same-origin'});
        if (!response.ok) throw new Error('copy failed');
        await copyText(await response.text());
        copyButton.textContent = 'copied';
      } catch (_error) {
        copyButton.textContent = 'failed';
      } finally {
        window.setTimeout(() => {
          copyButton.textContent = originalLabel;
        }, 2000);
      }
    });
  }

  function renderMarkdown(markdownSource) {
    const reflectionBody = document.getElementById('reflectionBody');
    if (reflectionBody) {
      reflectionBody.innerHTML = window.AppServices.renderMarkdown(markdownSource || '');
    }
  }

  function reflectionGridUnit(copy) {
    return {
      one: copy.grid_unit_one,
      other: copy.grid_unit_other,
      none: copy.grid_unit_none,
    };
  }

  function hideReflectionGrid(card, host, legend, unit) {
    card.hidden = true;
    if (window.DayGrid) {
      window.DayGrid.mount(host, {
        data: null,
        mode: 'navigate',
        appPath: '/app/reflections',
        unit,
        granularity: 'week',
      });
    } else {
      host.replaceChildren();
    }
    legend.replaceChildren();
  }

  async function fetchReflectionGrid() {
    try {
      const response = await fetch('/app/reflections/api/grid', {cache: 'no-store'});
      if (!response.ok) return null;
      return response.json();
    } catch (_error) {
      return null;
    }
  }

  async function renderReflectionGrid(copy) {
    const card = document.getElementById('reflectionGridCard');
    const host = document.getElementById('reflectionGridHost');
    const legend = document.getElementById('reflectionGridLegend');
    if (!card || !host || !legend) return;
    const unit = reflectionGridUnit(copy);
    const data = await fetchReflectionGrid();
    if (!data || !window.DayGrid) {
      hideReflectionGrid(card, host, legend, unit);
      return;
    }

    // Four active days means four reflection weeks; fourteen active days would
    // treat a healthy weekly surface as empty.
    const gate = window.DayGrid.gate(data, {minSpanDays: 70, minActiveDays: 4});
    if (!gate.ok) {
      hideReflectionGrid(card, host, legend, unit);
      return;
    }

    card.hidden = false;
    window.DayGrid.mount(host, {
      data,
      mode: 'navigate',
      appPath: '/app/reflections',
      unit,
      granularity: 'week',
      encode: 'presence',
    });
    window.DayGrid.legend(legend, {unit, data, encode: 'presence'});
  }

  function renderIndex(payload) {
    const copy = payload.copy || {};
    const weeks = payload.weeks || [];
    const listHtml = weeks.length
      ? `
        <div class="reflection-populated-framing">
          <p>${escapeHtml(copy.populated_framing)} <a href="${escapeHtml(copy.sample_url)}">${escapeHtml(copy.populated_sample_link)}</a></p>
        </div>
        <ul class="reflection-index-list">
          ${weeks.map((week) => `
            <li>
              <a class="reflection-index-link" href="${escapeHtml(week.url)}">
                <span class="reflection-index-day">week of ${escapeHtml(week.label)}</span>
                <span class="reflection-index-token">${escapeHtml(week.day)}</span>
              </a>
            </li>
          `).join('')}
        </ul>
        ${copy.populated_next_footer ? `<p class="reflection-next-footer">${escapeHtml(copy.populated_next_footer)}</p>` : ''}
      `
      : `
        <div class="reflection-empty-state">
          <p class="reflection-empty-body">${escapeHtml(copy.empty_body)}</p>
          <p class="reflection-empty-next">${escapeHtml(copy.empty_next)}</p>
          <p class="reflection-empty-until-then">${escapeHtml(copy.empty_until_then)}</p>
          <p class="reflection-empty-sample"><a href="${escapeHtml(copy.sample_url)}">${escapeHtml(copy.sample_link_label)}</a></p>
        </div>
      `;
    content.innerHTML = `
	      <header class="reflection-header">
	        <div>
	          <p class="reflection-kicker">weekly reflection</p>
	          <h2 class="reflection-title">reflections</h2>
	          <p class="reflection-subtitle">${escapeHtml(copy.subtitle)}</p>
	        </div>
	      </header>
	      <section class="reflection-grid-card" id="reflectionGridCard" hidden>
	        <h3 class="reflection-grid-title">${escapeHtml(copy.grid_title)}</h3>
	        <p class="reflection-grid-lede">${escapeHtml(copy.grid_lede)}</p>
	        <div class="reflection-grid-host" id="reflectionGridHost"></div>
	        <div class="reflection-grid-legend" id="reflectionGridLegend"></div>
	      </section>
	      <section class="reflection-index">${listHtml}</section>
	    `;
    renderReflectionGrid(copy);
  }

  function renderDetailEmpty(copy) {
    content.innerHTML = window.SurfaceState
      ? window.SurfaceState.empty({
          icon: window.ConveyIcons.svg('calendar-days'),
          heading: copy.heading,
          desc: copy.desc
        })
      : `<p>${escapeHtml(copy.heading)}</p><p>${escapeHtml(copy.desc)}</p>`;
  }

  function renderDetail(payload, requestedDay) {
    if (payload.day && requestedDay && payload.day !== requestedDay) {
      window.history.replaceState(
        window.history.state,
        '',
        `/app/reflections/${encodeURIComponent(payload.day)}`
      );
    }
    content.innerHTML = `
      <header class="reflection-header">
        <div>
          <p class="reflection-kicker">weekly reflection</p>
        </div>
        <div class="reflection-actions">
          <button type="button" class="reflection-button" id="copyReflectionButton">copy</button>
          <a class="reflection-link-button" href="${escapeHtml(payload.pdf_url)}">download PDF</a>
        </div>
      </header>

      <section class="reflection-body" id="reflectionBody"></section>
    `;
    renderMarkdown(payload.markdown);
    attachCopyButton(payload.raw_url);
  }

  function renderSample(payload) {
    content.innerHTML = `
      <header class="reflection-header">
        <div>
          <p class="reflection-kicker">weekly reflection</p>
          <h2 class="reflection-title">sample reflection</h2>
        </div>
        <div class="reflection-actions">
          <button type="button" class="reflection-button" id="copyReflectionButton">copy</button>
        </div>
      </header>

      <div class="reflection-sample-banner">${escapeHtml(payload.sample_banner)}</div>
      <section class="reflection-body" id="reflectionBody"></section>
    `;
    renderMarkdown(payload.markdown);
    attachCopyButton(payload.raw_url);
  }

  async function load() {
    const context = viewContext();
    renderLoading();
    try {
      const payload = await window.apiJson(context.url);
      if (context.mode === 'sample') {
        renderSample(payload);
      } else if (context.mode === 'detail') {
        renderDetail(payload, context.day);
      } else {
        renderIndex(payload);
      }
    } catch (err) {
      if (err?.status === 404 && err?.payload?.copy) {
        renderDetailEmpty(err.payload.copy);
        return;
      }
      renderError(err, load);
    }
  }

  load();
})();
</script>
