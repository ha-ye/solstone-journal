<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>curation evidence drawer smoke</title>
<style>
  body { font: 14px/1.4 sans-serif; padding: 16px; }
  .pass { color: var(--success-ink); }
  .fail { color: var(--danger); }
  #fixture { max-width: 720px; }
</style>
<link rel="stylesheet" href="../../../../convey/static/tokens.css">
<link rel="stylesheet" href="../../../../convey/static/drawer.css">
<h1>curation evidence drawer smoke</h1>
<div id="results"></div>
<div id="fixture"></div>
<script src="../../../../convey/static/drawer.js"></script>
<script src="../curation_evidence.js"></script>
<script>
  const results = document.getElementById('results');
  const fixture = document.getElementById('fixture');
  let failures = 0;

  function assert(name, condition, detail) {
    const row = document.createElement('div');
    row.className = condition ? 'pass' : 'fail';
    row.textContent = `${condition ? 'PASS' : 'FAIL'} ${name}${detail ? ` - ${detail}` : ''}`;
    results.appendChild(row);
    if (!condition) failures += 1;
  }

  function equal(name, actual, expected) {
    assert(name, actual === expected, `expected "${expected}", got "${actual}"`);
  }

  const item = {
    kind: 'facet_candidate',
    key: 'focus',
    evidence: {
      count: 4,
      samples: [
        { day: '20260701', stream: 'archon', segment: '090000_300' },
        { day: '20260702', stream: 'watch', segment: '100000_300' },
      ],
    },
  };

  function renderItem(targetItem = item) {
    const props = window.CurationEvidence.buildEvidenceDrawerProps(targetItem);
    fixture.innerHTML = props ? window.Drawer.render(props) : '';
    return fixture.querySelector('.drawer');
  }

  function run() {
    equal('curation public keys', Object.keys(window.CurationEvidence).join(','), 'buildEvidenceDrawerProps,formatEvidenceLine');
    equal('zero samples omit drawer', window.CurationEvidence.buildEvidenceDrawerProps({ kind: 'facet_candidate', key: 'empty', evidence: { samples: [] } }), null);

    let drawer = renderItem();
    assert('root is details', drawer && drawer.tagName === 'DETAILS');
    equal('data id', drawer.getAttribute('data-drawer-id'), 'curation-evidence:facet_candidate:focus');
    assert('default closed', drawer.open === false);
    equal('label text', drawer.querySelector('.drawer-label').textContent, 'evidence');
    equal('line text', drawer.querySelector('.drawer-line').textContent, '2 of 4');
    assert('digit runs auto-bolded', Array.from(drawer.querySelectorAll('.drawer-line b')).map((node) => node.textContent).join('|') === '2|4');
    assert('body list renders', drawer.querySelector('.drawer-evidence') !== null);
    assert('sample rows render', drawer.querySelectorAll('.drawer-evidence-row').length === 2);
    equal('day link href', drawer.querySelector('.drawer-evidence-row a.drawer-evidence-title').getAttribute('href'), '/app/timeline/20260701');
    equal('segment link href', drawer.querySelector('.drawer-evidence-row a.ev-meta').getAttribute('href'), '/app/transcripts/20260701#090000_300');
    assert('stream is not linked', drawer.querySelector('.drawer-evidence-row .ev-meta').tagName === 'SPAN');

    drawer.open = true;
    window.Drawer.preserveOpen(fixture, () => {
      const props = window.CurationEvidence.buildEvidenceDrawerProps(item);
      fixture.innerHTML = window.Drawer.render(props);
    });
    assert('preserveOpen restores evidence drawer', fixture.querySelector('[data-drawer-id="curation-evidence:facet_candidate:focus"]').open === true);

    if (failures > 0) {
      throw new Error(`${failures} curation evidence drawer assertion(s) failed`);
    }
  }

  try {
    run();
  } catch (error) {
    const row = document.createElement('div');
    row.className = 'fail';
    row.textContent = `FAIL unhandled error - ${error.message}`;
    results.appendChild(row);
    throw error;
  }
</script>
</html>
