<style>
/* Layout */
.search-container {
  display: flex;
  gap: 1.5rem;
  min-height: calc(100vh - 200px);
}

/* Sidebar */
.search-sidebar {
  width: 200px;
  flex-shrink: 0;
  border-right: 1px solid #e5e7eb;
  padding-left: 0.5rem;
  padding-right: 0.75rem;
  padding-top: 0.45rem;
}

.search-sidebar h3 {
  font-size: 11px;
  font-weight: 600;
  color: #9ca3af;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin: 0 0 0.5rem 0;
}

.filter-section {
  margin-bottom: 1.25rem;
}

.filter-section:not(:last-child) {
  border-bottom: 1px solid #e5e7eb;
  padding-bottom: 1.25rem;
}

.filter-list {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.filter-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.35rem 0.5rem;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.85rem;
  transition: background 0.15s;
}

.filter-item:hover {
  background: #f3f4f6;
}

.filter-item.active {
  background: #e5e7eb;
  box-shadow: inset 3px 0 0 var(--facet-color, #b06a1a);
  font-weight: 500;
}

.filter-item:active {
  background: #e5e7eb;
}

.filter-item input[type="radio"] {
  margin: 0;
  accent-color: var(--facet-color, #2563eb);
}

.filter-item input[type="radio"]:focus-visible {
  outline: 2px solid var(--facet-color, #b06a1a);
  outline-offset: 2px;
}

.filter-label {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.filter-count {
  font-size: 0.75rem;
  color: #9ca3af;
  flex-shrink: 0;
}

.filter-icon {
  font-size: 0.85rem;
}

/* Main content area */
.search-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

#results-container {
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* Results summary */
.search-summary {
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
  font-size: 0.85rem;
  color: #6b7280;
  margin-bottom: 1rem;
  font-variant-numeric: tabular-nums;
}

.search-range-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.2rem 0.5rem;
  border: 1px solid var(--orange-ink);
  border-radius: 999px;
  background: var(--orange-wash);
  color: var(--orange-ink);
  font: inherit;
  font-weight: 600;
}

.search-range-chip button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.25rem;
  height: 1.25rem;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--orange-ink);
  cursor: pointer;
  font: inherit;
  line-height: 1;
  padding: 0;
}

.search-range-chip button:hover {
  background: var(--paper);
}

.search-range-chip button:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.search-day-grid-card {
  background: var(--paper);
  border: 1px solid var(--hairline);
  border-radius: 8px;
  margin-bottom: 1rem;
  padding: 1rem;
}

.search-day-grid-card[hidden] {
  display: none;
}

.search-day-grid-card h2 {
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1rem;
  line-height: 1.2;
  margin: 0 0 0.25rem;
}

.search-day-grid-card p {
  color: var(--ink-soft-paper);
  font-size: 0.85rem;
  line-height: 1.4;
  margin: 0 0 0.85rem;
}

.search-day-grid-host {
  min-width: 0;
}

.search-day-grid-legend {
  margin-top: 0.75rem;
}

/* Day cards */
.day-card {
  background: white;
  border-radius: 8px;
  margin-bottom: 0.75rem;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  overflow: hidden;
}

.day-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.85rem 1rem;
  background: #f9fafb;
  border-bottom: 1px solid #e5e7eb;
  cursor: pointer;
  transition: background 0.1s ease;
}

.day-header:hover {
  background: #f3f4f6;
}

.day-header:active {
  background: #e5e7eb;
}

button.day-header {
  border: none;
  font: inherit;
  text-align: left;
  width: 100%;
}

.day-date {
  font-size: 0.9rem;
  font-weight: 600;
  color: #111827;
}

.day-count {
  font-size: 0.8rem;
  color: #6b7280;
}

.day-results {
  padding: 0;
}

/* Result items */
.result-item {
  padding: 0.75rem 1rem;
  border-bottom: 1px solid #e5e7eb;
  display: block;
  text-decoration: none;
  color: inherit;
  transition: background 0.1s ease;
}

.result-item:last-child {
  border-bottom: none;
}

.result-item:hover {
  background: #f9fafb;
}

.result-item:active {
  background: #f3f4f6;
}

.result-meta {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.35rem;
  flex-wrap: wrap;
}

.result-agent {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  font-size: 0.8rem;
  font-weight: 400;
  color: #374151;
}

.result-agent-icon {
  font-size: 0.9rem;
}

.result-facet {
  font-size: 0.7rem;
  padding: 0.15rem 0.4rem;
  border-radius: 3px;
  background: #f3f4f6;
  color: #6b7280;
  letter-spacing: 0.02em;
}

.result-facet.has-color {
  color: white;
}

.result-text {
  font-size: 0.9rem;
  color: #4b5563;
  line-height: 1.5;
  /* Fill available space */
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.result-text strong {
  color: #111827;
  background: #fef3c7;
  padding: 1px 3px;
  border-radius: 3px;
  font-weight: 600;
}

/* Show more button */
.show-more-btn {
  display: block;
  width: 100%;
  padding: 0.6rem;
  background: #f9fafb;
  border: none;
  border-top: 1px solid #e5e7eb;
  color: var(--facet-color, #2563eb);
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.1s ease;
  text-align: center;
}

.show-more-btn:hover {
  background: #f3f4f6;
}

.show-more-btn:active {
  background: #e5e7eb;
}

.show-more-btn:disabled {
  color: #9ca3af;
  cursor: not-allowed;
}

/* Load more days */
.load-more-days {
  display: block;
  width: 100%;
  padding: 0.75rem;
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  color: var(--facet-color, #2563eb);
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.1s ease;
  text-align: center;
  margin-top: 0;
}

.load-more-days:hover {
  background: #f9fafb;
}

.load-more-days:active {
  background: #f3f4f6;
}

/* Search input */
.search-input-form {
  margin-bottom: 1rem;
  margin-left: auto;
  margin-right: auto;
  max-width: 640px;
}

.search-input {
  width: 100%;
  padding: 0.75rem 1rem;
  font-size: 1rem;
  border: 1px solid #c8c0b8;
  border-radius: 8px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  box-sizing: border-box;
}

.search-input:focus {
  border-color: var(--facet-color, #2563eb);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

.search-input:hover:not(:focus) {
  border-color: #b8b0a8;
}

.search-input::placeholder {
  color: #aaa;
}

/* No-results suggestions */
.search-noresults-suggestions {
  margin-top: 1rem;
  font-size: 0.85rem;
  color: #6b7280;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  align-items: center;
}

.search-noresults-suggestions button {
  background: none;
  border: 1px solid #d1d5db;
  border-radius: 0.375rem;
  padding: 0.25rem 0.75rem;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  color: #4b5563;
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.1s ease, border-color 0.1s ease;
}

.search-noresults-suggestions button:hover {
  background: #f3f4f6;
  border-color: #9ca3af;
}

.search-noresults-suggestions button:active {
  background: #e5e7eb;
  border-color: #6b7280;
}

.search-agents-empty {
  color: #9ca3af;
  font-size: 0.85rem;
  padding: 0.25rem 0.5rem;
}

.search-example-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  justify-content: center;
}

.search-example-chip {
  display: inline-flex;
  align-items: center;
  padding: 0.4em 0.85em;
  background: #f3f4f6;
  border: 1px solid #ebe6e1;
  border-radius: 20px;
  font-size: 0.85rem;
  color: #374151;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}

.search-example-chip:hover {
  background: #e5e7eb;
  border-color: #ddd8d3;
}

.search-example-chip:focus-visible {
  outline: 2px solid var(--facet-color, #b06a1a);
  outline-offset: 2px;
}

.search-example-chip:active {
  background: #d1d5db;
}

/* Loading state */
/* Responsive */
@media (max-width: 768px) {
  .search-container {
    flex-direction: column;
  }

  .search-sidebar {
    width: 100%;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    border-right: none;
    margin-bottom: 0.25rem;
    padding-right: 0;
  }

  .search-input-form {
    margin-bottom: 0.75rem;
    margin-left: auto;
    margin-right: auto;
  }

  .filter-section {
    flex: 1;
    min-width: 150px;
    margin-bottom: 0.5rem;
  }

  .filter-section:not(:last-child) {
    border-bottom: none;
    padding-bottom: 0;
  }

  .filter-list {
    flex-direction: row;
    flex-wrap: wrap;
  }

  .filter-item {
    flex: 0 0 auto;
  }
}
</style>

<div class="workspace-content-wide">
  <div class="search-container">
    <!-- Sidebar -->
    <aside class="search-sidebar">
      <div class="filter-section" id="facet-filters">
        <h3>facets</h3>
        <div class="filter-list" id="facet-list">
          <label class="filter-item active">
            <input type="radio" name="facet" value="" checked>
            <span class="filter-label">all</span>
          </label>
        </div>
      </div>

      <div class="filter-section" id="agent-filters">
        <h3>talents</h3>
        <div class="filter-list" id="agent-list">
          <span class="search-agents-empty">talents appear here as your journal grows</span>
        </div>
      </div>
    </aside>

    <!-- Main content -->
    <main class="search-main">
      <form class="search-input-form" id="search-input-form" role="search">
        <label for="search-input" class="visually-hidden">search your journal</label>
        <input type="search" class="search-input" id="search-input"
               placeholder="search your journal..." autocomplete="off">
      </form>

      <div class="search-summary" id="search-summary" role="status" aria-live="polite" style="display: none;"></div>
      <div id="search-announcer" class="visually-hidden" aria-live="polite"></div>

      <section class="search-day-grid-card" id="search-day-grid-card" hidden>
        <h2>when</h2>
        <p>click a day — or click two, or drag, to pick a range</p>
        <div class="search-day-grid-host" id="search-day-grid-host"></div>
        <div class="search-day-grid-legend" id="search-day-grid-legend"></div>
      </section>

      <div id="results-container">
        <div class="surface-state surface-state--empty" id="search-empty">
          <div class="surface-state-icon" aria-hidden="true">🔍</div>
          <h2 class="surface-state-heading">search your journal</h2>
          <p class="surface-state-desc">find conversations, ideas, and moments — try one of these</p>
          <div class="surface-state-action">
            <div class="search-example-chips">
              <button class="search-example-chip" type="button">a recent meeting</button>
              <button class="search-example-chip" type="button">something i learned</button>
              <button class="search-example-chip" type="button">project ideas</button>
            </div>
          </div>
        </div>
      </div>

      <button id="load-more-days" class="load-more-days" style="display: none;">
        Load more days
      </button>
    </main>
  </div>
</div>

<script>
(function() {
  const searchUrl = '/app/search/api/search';
  const dayResultsUrl = '/app/search/api/day_results';
  const activitiesDayBase = '/app/activities/';
  const escapeHtml = (value) => window.AppServices.escapeHtml(value);

  // State
  let currentQuery = '';
  let currentFacet = '';
  let currentAgent = '';
  let dayOffset = 0;
  let currentRange;
  let lastSearchKey = null;
  let mountedDayGridKey = null;
  let forceDayGridRemount = false;
  let searchController = null;
  let loadMoreController = null;
  const dayGridUnit = { one: 'match', other: 'matches', none: 'no matches' };
  const searchMonthShort = [
    'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
    'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'
  ];

  // DOM elements
  const resultsContainer = document.getElementById('results-container');
  const searchSummary = document.getElementById('search-summary');
  const dayGridCard = document.getElementById('search-day-grid-card');
  const dayGridHost = document.getElementById('search-day-grid-host');
  const dayGridLegend = document.getElementById('search-day-grid-legend');
  const searchEmpty = document.getElementById('search-empty');
  const loadMoreDaysBtn = document.getElementById('load-more-days');
  const facetList = document.getElementById('facet-list');
  const agentList = document.getElementById('agent-list');
  const searchInput = document.getElementById('search-input');
  const searchInputForm = document.getElementById('search-input-form');
  const searchAnnouncer = document.getElementById('search-announcer');

  function bootstrapSearch() {
    loadFromHash();
    searchInput.focus();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootstrapSearch);
  } else {
    bootstrapSearch();
  }

  // Example chip delegation
  resultsContainer.addEventListener('click', function(e) {
    const chip = e.target.closest('.search-example-chip');
    if (!chip) return;
    searchInput.value = chip.textContent;
    currentQuery = chip.textContent;
    dayOffset = 0;
    updateHash();
    doSearch(true);
  });

  window.addEventListener('hashchange', loadFromHash);

  searchInputForm.onsubmit = function(e) {
    e.preventDefault();
    const query = searchInput.value.trim();
    currentQuery = query;
    dayOffset = 0;
    updateHash();
    doSearch(true);
  };

  // Listen for search submissions from app bar
  window.addEventListener('search.submit', (e) => {
    const query = e.detail.query;
    if (!query) return;
    currentQuery = query;
    searchInput.value = query;
    dayOffset = 0;
    updateHash();
    doSearch(true);
  });

  function loadFromHash() {
    const hashParams = new URLSearchParams(window.location.hash.slice(1));
    const q = hashParams.get('q') || '';
    const f = hashParams.get('facet') || '';
    const t = hashParams.get('agent') || '';

    if (q !== currentQuery || f !== currentFacet || t !== currentAgent) {
      currentQuery = q;
      currentFacet = f;
      currentAgent = t;

      // Notify app bar of query change
      window.dispatchEvent(new CustomEvent('search.queryUpdate', {
        detail: { query: q }
      }));
      searchInput.value = q;

      doSearch(true);
    }
  }

  function updateHash() {
    const params = new URLSearchParams();
    if (currentQuery) params.set('q', currentQuery);
    if (currentFacet) params.set('facet', currentFacet);
    if (currentAgent) params.set('agent', currentAgent);
    window.location.hash = params.toString();
  }

  function parseSearchDay(day) {
    if (typeof day !== 'string' || !/^\d{8}$/.test(day)) return null;
    const year = Number(day.slice(0, 4));
    const month = Number(day.slice(4, 6));
    const date = Number(day.slice(6, 8));
    const parsed = new Date(year, month - 1, date);
    if (
      parsed.getFullYear() !== year ||
      parsed.getMonth() !== month - 1 ||
      parsed.getDate() !== date
    ) {
      return null;
    }
    return parsed;
  }

  function formatSearchDay(day) {
    const parsed = parseSearchDay(day);
    if (!parsed) return day;
    return `${searchMonthShort[parsed.getMonth()]} ${parsed.getDate()}`;
  }

  function formatSearchRange(range) {
    if (!range) return '';
    const from = formatSearchDay(range.from);
    const to = formatSearchDay(range.to);
    return range.from === range.to ? from : `${from} – ${to}`;
  }

  function sameRange(left, right) {
    if (!left && !right) return true;
    if (!left || !right) return false;
    return left.from === right.from && left.to === right.to;
  }

  function dayGridKey() {
    return JSON.stringify([currentQuery, currentFacet, currentAgent]);
  }

  function setSearchRange(range) {
    const next = range ? { from: range.from, to: range.to } : null;
    if (sameRange(currentRange, next)) return;
    currentRange = next;
    doSearch(true);
  }

  function clearSearchRangeFromChip() {
    if (!currentRange) return;
    currentRange = null;
    forceDayGridRemount = true;
    doSearch(true);
  }

  // Load more days
  loadMoreDaysBtn.onclick = function() {
    dayOffset += 20;
    doSearch(false);
  };

  function announce(msg) {
    searchAnnouncer.textContent = '';
    setTimeout(() => { searchAnnouncer.textContent = msg; }, 100);
  }

  // Main search function
  function doSearch(reset) {
    const key = dayGridKey();
    if (key !== lastSearchKey) currentRange = null;
    lastSearchKey = key;

    if (!currentQuery) {
      showEmpty();
      return;
    }

    searchController?.abort();
    searchController = new AbortController();

    if (reset) {
      dayOffset = 0;
      resultsContainer.innerHTML = window.SurfaceState.loading({ text: 'Searching...' });
      announce('searching…');
    }

    const url = new URL(searchUrl, window.location.origin);
    url.searchParams.set('q', currentQuery);
    url.searchParams.set('offset', dayOffset);
    if (currentFacet) url.searchParams.set('facet', currentFacet);
    if (currentAgent) url.searchParams.set('agent', currentAgent);
    if (currentRange) {
      url.searchParams.set('day_from', currentRange.from);
      url.searchParams.set('day_to', currentRange.to);
    }

    fetch(url, { signal: searchController.signal })
      .then(r => {
        if (!r.ok) throw new Error('search returned ' + r.status);
        return r.json();
      })
      .then(data => {
        if (reset) {
          resultsContainer.innerHTML = '';
          renderFilters(data.facets, data.talents || []);
          renderSearchDayGrid(data);
        }

        renderResults(data, reset);
        updateSummary(data);
        updateLoadMoreButton(data);
      })
      .catch(err => {
        if (err.name === 'AbortError') return;
        console.error('Search error:', err);
        if (reset) hideSearchDayGrid();
        resultsContainer.innerHTML = window.SurfaceState.error({
          heading: 'something went wrong with that search',
          desc: 'could be a network issue or the server might be busy — give it a moment',
          retry: true,
          retryLabel: 'try again',
          detail: err
        });
        resultsContainer.querySelector('.surface-state-retry').onclick = () => doSearch(true);
        announce('search failed, use the try again button to retry');
      });
  }

  function showEmpty() {
    hideSearchDayGrid();
    resultsContainer.innerHTML = '';
    resultsContainer.appendChild(searchEmpty.cloneNode(true));
    searchSummary.style.display = 'none';
    loadMoreDaysBtn.style.display = 'none';
  }

  function hideSearchDayGrid() {
    dayGridCard.hidden = true;
    mountedDayGridKey = null;
    window.DayGrid.mount(dayGridHost, {
      data: null,
      mode: 'select',
      unit: dayGridUnit,
      onRange: setSearchRange
    });
    dayGridLegend.replaceChildren();
  }

  function renderSearchDayGrid(data) {
    const key = dayGridKey();
    const shouldRemount = forceDayGridRemount || key !== mountedDayGridKey;
    forceDayGridRemount = false;
    if (!shouldRemount) return;

    const gate = window.DayGrid.gate(data.day_grid, { minSpanDays: 70, minActiveDays: 3 });
    if (!gate.ok) {
      hideSearchDayGrid();
      return;
    }

    dayGridCard.hidden = false;
    window.DayGrid.mount(dayGridHost, {
      data: data.day_grid,
      mode: 'select',
      unit: dayGridUnit,
      onRange: setSearchRange
    });
    window.DayGrid.legend(dayGridLegend, { unit: dayGridUnit, data: data.day_grid });
    mountedDayGridKey = key;
  }

  function renderFilters(facets, talents) {
    // Render facet filters
    let facetHtml = `
      <label class="filter-item ${!currentFacet ? 'active' : ''}">
        <input type="radio" name="facet" value="" ${!currentFacet ? 'checked' : ''}>
        <span class="filter-label">all</span>
      </label>
    `;

    for (const f of facets) {
      const isActive = currentFacet === f.name;
      const emoji = f.emoji ? `<span class="filter-icon">${f.emoji}</span>` : '';
      facetHtml += `
        <label class="filter-item ${isActive ? 'active' : ''}">
          <input type="radio" name="facet" value="${escapeHtml(f.name)}" ${isActive ? 'checked' : ''}>
          ${emoji}
          <span class="filter-label">${escapeHtml(f.title || f.name)}</span>
          <span class="filter-count">${f.count}</span>
        </label>
      `;
    }
    facetList.innerHTML = facetHtml;

    // Add facet change handlers
    facetList.querySelectorAll('input[type="radio"]').forEach(input => {
      input.onchange = function() {
        currentFacet = this.value;
        facetList.querySelectorAll('.filter-item').forEach(item => {
          item.classList.toggle('active', item.querySelector('input').value === currentFacet);
        });
        updateHash();
        doSearch(true);
      };
    });

    // Render agent filters (radio buttons for single-select)
    if (talents.length === 0) {
      agentList.innerHTML = '<span class="search-agents-empty">talents appear here as your journal grows</span>';
    } else {
      let agentHtml = `
        <label class="filter-item ${!currentAgent ? 'active' : ''}">
          <input type="radio" name="agent" value="" ${!currentAgent ? 'checked' : ''}>
          <span class="filter-label">all</span>
        </label>
      `;
      for (const t of talents) {
        const isActive = currentAgent === t.name;
        agentHtml += `
          <label class="filter-item ${isActive ? 'active' : ''}">
            <input type="radio" name="agent" value="${escapeHtml(t.name)}" ${isActive ? 'checked' : ''}>
            <span class="filter-icon">${t.icon}</span>
            <span class="filter-label">${escapeHtml(t.label)}</span>
            <span class="filter-count">${t.count}</span>
          </label>
        `;
      }
      agentList.innerHTML = agentHtml;

      // Add agent change handlers
      agentList.querySelectorAll('input[type="radio"]').forEach(input => {
        input.onchange = function() {
          currentAgent = this.value;
          agentList.querySelectorAll('.filter-item').forEach(item => {
            item.classList.toggle('active', item.querySelector('input').value === currentAgent);
          });
          updateHash();
          doSearch(true);
        };
      });
    }
  }

  function renderResults(data, reset) {
    if (data.days.length === 0 && reset) {
      const suggestionsHtml = '<div class="search-noresults-suggestions">'
        + '<span>try different keywords or check your spelling</span>'
        + (currentFacet ? `<button type="button" data-clear="facet">search all facets instead of ${escapeHtml(currentFacet)}</button>` : '')
        + (currentAgent ? `<button type="button" data-clear="agent">search all talents instead of ${escapeHtml(currentAgent)}</button>` : '')
        + '</div>';

      resultsContainer.innerHTML = window.SurfaceState.empty({
        icon: '🔍',
        heading: `no results found for "${currentQuery}"`,
        action: suggestionsHtml
      });

      const clearFacetBtn = resultsContainer.querySelector('[data-clear="facet"]');
      if (clearFacetBtn) {
        clearFacetBtn.onclick = () => {
          currentFacet = '';
          updateHash();
          doSearch(true);
        };
      }

      const clearAgentBtn = resultsContainer.querySelector('[data-clear="agent"]');
      if (clearAgentBtn) {
        clearAgentBtn.onclick = () => {
          currentAgent = '';
          updateHash();
          doSearch(true);
        };
      }

      let msg = 'no results found';
      if (currentFacet || currentAgent) msg += ', try clearing filters';
      announce(msg);
      return;
    }

    for (const dayData of data.days) {
      const card = createDayCard(dayData);
      resultsContainer.appendChild(card);
    }
  }

  function createDayCard(dayData) {
    const card = document.createElement('div');
    card.className = 'day-card';
    card.dataset.day = dayData.day;

    const header = document.createElement('button');
    header.className = 'day-header';
    header.innerHTML = `
      <span class="day-date">${escapeHtml(dayData.date)}</span>
      <span class="day-count">${dayData.total} match${dayData.total !== 1 ? 'es' : ''}</span>
    `;
    header.onclick = function() {
      window.location.href = activitiesDayBase + dayData.day;
    };

    const resultsDiv = document.createElement('div');
    resultsDiv.className = 'day-results';

    for (const result of dayData.results) {
      resultsDiv.appendChild(createResultItem(result));
    }

    card.appendChild(header);
    card.appendChild(resultsDiv);

    // Show more button if needed
    if (dayData.has_more) {
      const showMoreBtn = document.createElement('button');
      showMoreBtn.className = 'show-more-btn';
      showMoreBtn.textContent = `Show ${dayData.total - dayData.showing} more`;
      showMoreBtn.onclick = function(e) {
        e.stopPropagation();
        loadMoreForDay(dayData.day, dayData.showing, resultsDiv, showMoreBtn);
      };
      card.appendChild(showMoreBtn);
    }

    return card;
  }

  function createResultItem(result) {
    const item = document.createElement('a');
    item.className = 'result-item';
    item.href = activitiesDayBase + result.day;

    // Build facet badge
    let facetBadge = '';
    if (result.facet) {
      const style = result.facet_color
        ? `background: ${result.facet_color}; color: white;`
        : '';
      const hasColor = result.facet_color ? 'has-color' : '';
      const emoji = result.facet_emoji ? result.facet_emoji + ' ' : '';
      facetBadge = `<span class="result-facet ${hasColor}" style="${style}">${emoji}#${escapeHtml(result.facet)}</span>`;
    }

    item.innerHTML = `
      <div class="result-meta">
        <span class="result-agent">
          <span class="result-agent-icon">${result.agent_icon}</span>
          ${escapeHtml(result.agent_label)}
        </span>
        ${facetBadge}
      </div>
      <div class="result-text">${result.text}</div>
    `;

    return item;
  }

  function loadMoreForDay(day, currentOffset, resultsDiv, btn) {
    loadMoreController?.abort();
    loadMoreController = new AbortController();
    btn.textContent = 'loading...';
    btn.disabled = true;

    const url = new URL(dayResultsUrl, window.location.origin);
    url.searchParams.set('q', currentQuery);
    url.searchParams.set('day', day);
    url.searchParams.set('offset', currentOffset);
    url.searchParams.set('limit', 20);
    if (currentFacet) url.searchParams.set('facet', currentFacet);
    if (currentAgent) url.searchParams.set('agent', currentAgent);

    fetch(url, { signal: loadMoreController.signal })
      .then(r => r.json())
      .then(data => {
        for (const result of data.results) {
          resultsDiv.appendChild(createResultItem(result));
        }

        const newOffset = currentOffset + data.results.length;
        const remaining = data.total - newOffset;

        if (remaining > 0) {
          btn.textContent = `Show ${remaining} more`;
          btn.disabled = false;
          btn.onclick = function(e) {
            e.stopPropagation();
            loadMoreForDay(day, newOffset, resultsDiv, btn);
          };
        } else {
          btn.remove();
        }
      })
      .catch(err => {
        if (err.name === 'AbortError') return;
        console.error('Load more error:', err);
        btn.textContent = 'error - click to retry';
        btn.disabled = false;
      });
  }

  function updateSummary(data) {
    if (data.total === 0 && !currentRange) {
      searchSummary.style.display = 'none';
      announce('no results found');
      return;
    }

    let summary = `${data.total} match${data.total !== 1 ? 'es' : ''} across ${data.total_days} day${data.total_days !== 1 ? 's' : ''}`;
    if (data.relaxed) summary += ' · showing broader matches';
    searchSummary.replaceChildren(document.createTextNode(summary));

    const rangeLabel = formatSearchRange(currentRange);
    if (rangeLabel) {
      const chip = document.createElement('span');
      chip.className = 'search-range-chip';
      const label = document.createElement('span');
      label.textContent = rangeLabel;
      const clearButton = document.createElement('button');
      clearButton.type = 'button';
      clearButton.setAttribute('aria-label', 'clear range');
      clearButton.textContent = '×';
      clearButton.onclick = clearSearchRangeFromChip;
      chip.append(label, clearButton);
      searchSummary.appendChild(chip);
    }

    searchSummary.style.display = 'flex';
    announce(rangeLabel ? `${summary} · ${rangeLabel}` : summary);
  }

  function updateLoadMoreButton(data) {
    const totalDays = data.total_days;
    const shownDays = dayOffset + data.showing_days;

    if (shownDays < totalDays) {
      loadMoreDaysBtn.textContent = `Load more days (${shownDays}/${totalDays})`;
      loadMoreDaysBtn.style.display = 'block';
    } else {
      loadMoreDaysBtn.style.display = 'none';
    }
  }

})();
</script>
