<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>import detail smoke</title>
<style>
  body { font: 14px/1.4 sans-serif; padding: 16px; }
  .pass { color: var(--success-ink); }
  .fail { color: var(--danger); }
  #fixture { max-width: 760px; }
  .import-leads-card { border: 1px solid var(--facet-border, #e5e0db); border-radius: 6px; padding: 1rem; margin-bottom: 1rem; background: #fff; }
  .import-leads-card h2 { margin: 0 0 0.6rem; font-size: 1rem; }
  .import-leads-facts { display: flex; flex-wrap: wrap; gap: 0.4rem 0.75rem; color: #555; font-size: 0.92rem; }
  .import-leads-links { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.75rem; }
  .import-collision-callout { margin-bottom: 1rem; padding: 0.9rem 1rem; border-left: 4px solid #d97706; background: #fff7ed; border-radius: 6px; }
  .drawer-raw { margin-top: 0.75rem; border: 1px solid var(--facet-border, #e5e0db); border-radius: 6px; background: #fff; }
  .drawer-raw summary { cursor: pointer; padding: 0.55rem 0.75rem; font-weight: 600; }
  .drawer-raw pre { margin: 0; padding: 0.75rem; border-top: 1px solid var(--facet-border, #e5e0db); overflow-x: auto; font-family: monospace; font-size: 0.86rem; white-space: pre-wrap; }
</style>
<link rel="stylesheet" href="../../../../convey/static/tokens.css">
<link rel="stylesheet" href="../../../../convey/static/drawer.css">
<h1>import detail smoke</h1>
<div id="results"></div>
<div id="fixture"></div>
<script src="../../../../convey/static/drawer.js"></script>
<script src="../import_detail.js"></script>
<script>
  const results = document.getElementById('results');
  const fixture = document.getElementById('fixture');
  let failures = 0;

  function assert(name, condition, detail) {
    const row = document.createElement('div');
    row.className = condition ? 'pass' : 'fail';
    row.textContent = `${condition ? 'PASS' : 'FAIL'} ${name}${detail ? ` - ${detail}` : ''}`;
    results.appendChild(row);
    if (!condition) failures += 1;
  }

  function equal(name, actual, expected) {
    assert(name, actual === expected, `expected "${expected}", got "${actual}"`);
  }

  const clean = {
    timestamp: '20260101_090000',
    import_json: {
      original_filename: 'calendar-export.zip',
      upload_datetime: '2026-01-01T09:00:00',
      user_timestamp: '20260101_090000',
      file_size: 45678,
      mime_type: 'application/zip',
      facet: 'work',
      setting: 'calendar'
    },
    imported_json: {
      processing_completed: '2026-01-01T09:10:00',
      total_files_created: 2,
      all_created_files: [
        '20260101/import.ics/090000_300/plain_event_transcript.md',
        'chronicle/20260101/import.ics/093000_300/anchored_event_transcript.md'
      ],
      source_type: 'ics',
      source_display: 'calendar',
      entries_written: 5,
      entities_seeded: 0,
      date_range: ['20260101', '20260101'],
      target_day: '20260101'
    }
  };

  const collision = {
    ...clean,
    imported_json: {
      ...clean.imported_json,
      entries_written: 1,
      total_files_created: 0,
      principal_collision: {
        source_name: 'source person',
        target_name: 'target person'
      },
      merge_summary: {
        segments_copied: 1,
        segments_skipped: 0,
        segments_errored: 0,
        entities_created: 0,
        entities_merged: 0,
        entities_staged: 1,
        facets_created: 0,
        facets_merged: 0,
        imports_copied: 0,
        imports_skipped: 0
      }
    },
    decision_highlights: {
      staged_entities: [{
        source_name: 'source person',
        target_name: 'target person',
        staging_path: '/tmp/staging/source_person/entity.json'
      }],
      errored_segments: []
    },
    summary_errors: ['segment copy failed'],
    merge_artifact_paths: {
      decisions: '/tmp/decisions.jsonl',
      staging: '/tmp/staging'
    }
  };

  const errorPayload = {
    ...clean,
    imported_json: {
      processing_started: '2026-01-01T09:00:00',
      processing_failed: '2026-01-01T09:02:00',
      source_type: 'generic',
      source_display: 'calendar-export.zip',
      entries_written: 0,
      entities_seeded: 0,
      date_range: null,
      error: 'bad <archive>',
      error_stage: 'writing',
      total_files_created: 0,
      all_created_files: []
    }
  };

  function render(payload) {
    fixture.innerHTML = window.ImportDetail.renderDetail(payload);
    return fixture;
  }

  function run() {
    equal('public keys', Object.keys(window.ImportDetail).join(','), 'renderDetail,renderMeta,deriveStatus,formatDuration,composeDrawerLine,resolveDay,createdFileHref,hasValue,kvRow');

    let root = render(clean);
    equal('clean drawer closed', root.querySelector('.drawer').open, false);
    equal('clean line', root.querySelector('.drawer-line').textContent, '2 files created · 5 entries · completed in 10 minutes');
    assert('clean leads has activities link', root.querySelector('a[href="/app/activities/20260101"]'));
    assert('clean leads has timeline link', root.querySelector('a[href="/app/timeline/20260101"]'));
    const plainFileName = clean.imported_json.all_created_files[0].split('/').pop();
    const plainFileRow = Array.from(root.querySelectorAll('.drawer-evidence-row')).find((row) => row.textContent.includes(plainFileName));
    assert('plain created fixture path row exists', plainFileRow);
    assert('plain created fixture path is text', plainFileRow && !plainFileRow.querySelector('a'));
    assert('chronicle created fixture path links timeline', root.querySelector('.drawer-evidence-row a[href="/app/timeline/20260101"]'));
    const rawBlocks = root.querySelectorAll('details.drawer-raw');
    equal('single raw disclosure', rawBlocks.length, 1);
    const rawPayload = JSON.parse(rawBlocks[0].querySelector('pre').textContent);
    equal('raw payload filename', rawPayload.import_json.original_filename, clean.import_json.original_filename);
    assert('raw payload has both keys', Object.prototype.hasOwnProperty.call(rawPayload, 'import_json') && Object.prototype.hasOwnProperty.call(rawPayload, 'imported_json'));

    root = render(collision);
    equal('collision drawer open', root.querySelector('.drawer').open, true);
    assert('collision warn chip', root.querySelector('.drawer-chip--warn'));
    assert('collision callout inside drawer', root.querySelector('.drawer .import-collision-callout'));
    equal('collision settings link', root.querySelector('.import-collision-callout a').getAttribute('href'), '/app/settings#profile');

    root = render(errorPayload);
    equal('error line', root.querySelector('.drawer-line').textContent, 'failed while processing');
    assert('error danger chip', root.querySelector('.drawer-chip--danger'));
    assert('escaped error body', root.innerHTML.includes('bad &lt;archive&gt;'));

    if (failures > 0) {
      throw new Error(`${failures} import detail smoke assertion(s) failed`);
    }
  }

  try {
    run();
  } catch (error) {
    const row = document.createElement('div');
    row.className = 'fail';
    row.textContent = `FAIL unhandled error - ${error.message}`;
    results.appendChild(row);
    throw error;
  }
</script>
</html>
